    };
    
    function playSound(type) {
        if (!soundEnabled) return;
        try {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            if (type === 'correct') {
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.5);

                oscillator.frequency.setValueAtTime(300, audioContext.currentTime);

    function getUniqueQuestions(track, count) {
        const bank = questionBank[track]; 
        const available = bank.filter(q => !usedIds[track].includes(q.id));
        if (available.length < count) { 
            usedIds[track] = []; 
            return getUniqueQuestions(track, count); 
        }
        const shuffled = [...available].sort(() => Math.random() - 0.5); 
        const selected = shuffled.slice(0, count);
        selected.forEach(q => usedIds[track].push(q.id)); 
        return selected;

    window.startQUIZE = function() {
        userProfile.fullName = document.getElementById('fullName').value || "Martin Mwila";
        userProfile.school = document.getElementById('schoolName').value || "Katete Day";
        userProfile.zone = document.getElementById('zoneName').value || "Katete Central";
        userProfile.district = document.getElementById('districtName').value || "Katete";
        candidateInfo.innerHTML = `${userProfile.fullName} | ${userProfile.school} | ${userProfile.zone} | ${userProfile.district}`;
        currentLevel = 0; 
        currentQuestions = getUniqueQuestions(currentTrack, 20); 
        currentIndex = 0;
        userAnswers = new Array(20).fill(null); 
        userSelections = new Array(20).fill(null); 
        score = 0;
        updateScore(); 
        showSection('quizPanel'); 
        renderQuestion(); 
        startTimer();
    };

    // ========== RENDER QUESTION ==========
    function renderQuestion() {
        if (!currentQuestions[currentIndex]) return; 
        const q = currentQuestions[currentIndex];
        const formNames = ['Form 1', 'Form 2', 'Form 3', 'Form 4'];
        levelDisplay.innerHTML = `${formNames[currentLevel]} · ${q.topic}`;
        
        let html = `<div class="question-number">Question ${currentIndex+1} / 20 · DB#${q.databaseNumber}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-grid">`;
        
        q.options.forEach((opt, idx) => { 
            let additionalClasses = '';
            
            if (userAnswers[currentIndex] !== null) {
                if (idx === q.answer) {
                    additionalClasses = 'correct-answer';
                } else if (idx === userAnswers[currentIndex] && userAnswers[currentIndex] !== q.answer) {
                    additionalClasses = 'wrong-answer';
                }
            } else {
                if (userSelections[currentIndex] === idx) {
                    additionalClasses = 'selected';
                }
            }
            
            html += `<div class="option ${additionalClasses}" onclick="selectOption(${idx})">
                        <span class="option-prefix">${String.fromCharCode(65+idx)}</span>${opt}
                     </div>`; 
        });
        
        html += '</div>';
        
        if (userAnswers[currentIndex] !== null) {
            const isCorrect = userAnswers[currentIndex] === q.answer;
            const resultText = isCorrect ? '✅ Correct!' : '❌ Incorrect';
            const correctLetter = String.fromCharCode(65 + q.answer);
            html += `<div class="explanation">
                        <strong>${resultText}</strong><br>
                        Correct answer: ${correctLetter}. ${q.correctAnswerText}<br>
                        <small>${q.explanation}</small>
                     </div>`;
        }
        
        questionContainer.innerHTML = html; 
        updateProgress();
        
        submitBtn.disabled = userAnswers[currentIndex] !== null; 
        submitBtn.style.opacity = userAnswers[currentIndex] !== null ? '0.5' : '1';
    }

    // ========== SELECT OPTION ==========
    window.selectOption = function(idx) { 
        if (userAnswers[currentIndex] !== null) return;
        
        userSelections[currentIndex] = idx; 
        
        document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
        event.target.closest('.option').classList.add('selected');
    };
    
    // ========== SUBMIT ANSWER ==========
    window.submitAnswer = function() {
        if (userSelections[currentIndex] === null) { 
            alert('Please select an answer first'); 
            return; 
        }
        
        userAnswers[currentIndex] = userSelections[currentIndex];
        renderQuestion();
        
        const isCorrect = userAnswers[currentIndex] === currentQuestions[currentIndex].answer;
        if (isCorrect) { 
            score += 10; 
            playSound('correct'); 
        } else { 
            playSound('wrong'); 
        }
        updateScore();
    };
    
    // ========== NEXT QUESTION ==========
    window.nextQuestion = function() {
        if (userAnswers[currentIndex] === null) { 
            alert('Please submit your answer first'); 
            return; 
        }
        
        if (currentIndex < currentQuestions.length-1) { 
            currentIndex++; 
            renderQuestion(); 
            resetTimer(); 
        } else { 
            finishLevel(); 
        }
    };
    
    // ========== FINISH LEVEL with PRINT PREVIEW ==========
    function finishLevel() {
        clearInterval(timer); 
        const correctCount = userAnswers.filter((ans, idx) => ans === currentQuestions[idx].answer).length;
        const percentage = Math.round((correctCount/20)*100); 
        let emoji = correctCount >= 18 ? '🏆' : correctCount >= 15 ? '🌟' : correctCount >= 10 ? '👍' : '💪';
        
        let resultsHTML = `
            <div class="results-preview">
                <h3 style="color: var(--zambia-blue); margin-bottom: 1rem;">Level ${currentLevel+1} Results Preview</h3>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Question</th>
                            <th>Your Answer</th>
                            <th>Correct Answer</th>
                            <th>Status</th>
                            <th>Explanation</th>
                        </tr>
                    </thead>
                    <tbody>
        `;
        
        currentQuestions.forEach((q, idx) => {
            const userAns = userAnswers[idx];
            const isCorrect = userAns === q.answer;
            const userLetter = userAns !== null && userAns !== -1 ? String.fromCharCode(65 + userAns) : 'Not answered';
            const userText = userAns !== null && userAns !== -1 ? q.options[userAns] : 'No answer';
            const correctLetter = String.fromCharCode(65 + q.answer);
            const correctText = q.correctAnswerText;
            const rowClass = isCorrect ? 'correct-row' : 'incorrect-row';
            
            resultsHTML += `
                <tr class="${rowClass}">
                    <td>${idx+1}</td>
                    <td><strong>${q.question}</strong></td>
                    <td>${userLetter}. ${userText}</td>
                    <td>${correctLetter}. ${correctText}</td>
                    <td>${isCorrect ? '✅' : '❌'}</td>
                    <td class="explanation-cell">${q.explanation}</td>
                </tr>
            `;
        });
        
        resultsHTML += `
                    </tbody>
                </table>
                <div style="margin-top: 1.5rem; text-align: center;">
                    <button class="btn btn-green" onclick="printResults()">🖨️ Print Full Report</button>
                </div>
            </div>
        `;
        
        levelComplete.innerHTML = `
            <div style="background:white; border-radius:var(--radius-lg); padding:clamp(1.5rem,5vw,2.5rem);">
                <div style="text-align:center;">
                    <h2 style="color:var(--zambia-green);">Level ${currentLevel+1} Complete!</h2>
                    <div class="feedback-emoji">${emoji}</div>
                    <div style="font-size:clamp(3rem,15vw,5rem);">${correctCount}/20</div>
                    <div style="font-size:1.5rem;">${percentage}%</div>
                    <div style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; margin-top:1.5rem;">
                        ${currentLevel<9 ? '<button class="btn" onclick="nextLevel()">🚀 Next Level</button>' : '<button class="btn btn-green" onclick="showResults()">🏁 Final Results</button>'}
                        <button class="btn" onclick="showSection('mainMenu')">🏠 Home</button>
                    </div>
                </div>
                ${resultsHTML}
            </div>
        `;
        
        showSection('levelComplete');
    }
    
    // ========== PRINT RESULTS ==========
    window.printResults = function() {
        const printWindow = window.open('', '_blank');
        const formNames = ['Form 1', 'Form 2', 'Form 3', 'Form 4'];
        const correctCount = userAnswers.filter((ans, idx) => ans === currentQuestions[idx].answer).length;
        const percentage = Math.round((correctCount/20)*100);
        
        let tableRows = '';
        currentQuestions.forEach((q, idx) => {
            const userAns = userAnswers[idx];
            const isCorrect = userAns === q.answer;
            const userLetter = userAns !== null && userAns !== -1 ? String.fromCharCode(65 + userAns) : 'N/A';
            const userText = userAns !== null && userAns !== -1 ? q.options[userAns] : 'No answer';
            const correctLetter = String.fromCharCode(65 + q.answer);
            const correctText = q.correctAnswerText;
            const rowColor = isCorrect ? '#d4edda' : '#f8d7da';
            
            tableRows += `
                <tr style="background-color: ${rowColor};">
                    <td>${idx+1}</td>
                    <td>${q.databaseNumber}</td>
                    <td>${q.topic}</td>
                    <td>${q.question}</td>
                    <td>${userLetter}. ${userText}</td>
                    <td>${correctLetter}. ${correctText}</td>
                    <td>${isCorrect ? 'Correct' : 'Incorrect'}</td>
                </tr>
                <tr style="background-color: #f0f9ff;">
                    <td colspan="7" style="padding: 10px; border-left: 4px solid #006B3F;">
                        <strong>Explanation:</strong> ${q.explanation}
                    </td>
                </tr>
            `;
        });
        
        printWindow.document.write(`
            <html>
            <head>
                <title>CyberSafe ICT - Level ${currentLevel+1} Report</title>
                <style>
                    body { font-family: Arial, sans-serif; padding: 30px; }
                    h1 { color: #006B3F; }
                    h2 { color: #0033a0; }
                    .header { 
                        background: linear-gradient(135deg, #006B3F, #0033a0); 
                        color: white; 
                        padding: 20px; 
                        border-radius: 40px; 
                        margin-bottom: 20px;
                    }
                    table { 
                        border-collapse: collapse; 
                        width: 100%; 
                        margin-top: 20px;
                        page-break-inside: avoid;
                    }
                    th { 
                        background: #006B3F; 
                        color: white; 
                        padding: 12px; 
                        text-align: left;
                    }
                    td { 
                        border: 1px solid #ddd; 
                        padding: 10px; 
                        vertical-align: top;
                    }
                    .summary {
                        font-size: 1.2rem;
                        margin: 15px 0;
                    }
                    @media print {
                        body { padding: 0.2in; }
                        .no-print { display: none; }
                    }
                </style>
            </head>
            <body>
                <div class="header">
                    <h1>🛡️ CyberSafe ICT CBC Zambia</h1>
                    <h2>Level ${currentLevel+1} Performance Report</h2>
                    <p><strong>${userProfile.fullName}</strong> | ${userProfile.school} | ${userProfile.zone} District</p>
                    <p>Form: ${formNames[currentLevel]} | Date: ${new Date().toLocaleDateString()}</p>
                </div>
                
                <div class="summary">
                    <strong>Score: ${correctCount}/20 (${percentage}%)</strong>
                </div>
                
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>DB#</th>
                            <th>Topic</th>
                            <th>Question</th>
                            <th>Your Answer</th>
                            <th>Correct Answer</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>
                
                <p style="margin-top: 30px;">Report generated by CyberSafe ICT System | © Mwila Christopher</p>
            </body>
            </html>
        `);
        
        printWindow.document.close();
        printWindow.print();
    };
    
    // ========== NEXT LEVEL ==========
    window.nextLevel = function() { 
        if (currentLevel < 9) { 
            currentLevel++; 
            currentQuestions = getUniqueQuestions(currentTrack, 20); 
            currentIndex = 0; 
            userAnswers = new Array(20).fill(null); 
            userSelections = new Array(20).fill(null); 
            score = 0; 
            updateScore(); 
            showSection('quizPanel'); 
            renderQuestion(); 
            startTimer(); 
        } else { 
            showResults(); 
        } 
    };
    
    // ========== SHOW RESULTS ==========
    window.showResults = function() { 
        const correct = userAnswers.filter((ans, idx) => ans === currentQuestions[idx].answer).length; 
        resultsSection.innerHTML = `
            <div style="padding:clamp(1.5rem,5vw,2.5rem); text-align:center;">
                <h2 style="color:var(--zambia-green);">Final Results</h2>
                <div class="user-badge">${userProfile.fullName}</div>
                <div style="font-size:clamp(3rem,15vw,5rem);">${correct}/20</div>
                <div style="margin:1rem;">${Math.round(correct/20*100)}%</div>
                <button class="btn" onclick="printResults()">🖨️ Print Full Report</button>
                <button class="btn btn-blue" onclick="showSection('mainMenu')">Home</button>
            </div>
        `; 
        showSection('resultsSection'); 
    };
    
    // ========== TIMER FUNCTIONS ==========
    function startTimer() { 
        clearInterval(timer); 
        timeLeft = 30; 
        timerDisplay.textContent = '00:30'; 
        timer = setInterval(() => { 
            timeLeft--; 
            timerDisplay.textContent = `00:${timeLeft<10 ? '0'+timeLeft : timeLeft}`; 
            if (timeLeft <= 0 && userAnswers[currentIndex] === null && userSelections[currentIndex] === null) { 
                clearInterval(timer); 
                userSelections[currentIndex] = -1; 
                userAnswers[currentIndex] = -1; 
                playSound('wrong'); 
                renderQuestion(); 
            } 
        }, 1000); 
    }
    
    function resetTimer() { 
        clearInterval(timer); 
        startTimer(); 
    }
    
    function updateScore() { 
        scoreDisplay.textContent = `${Math.floor(score/10)}/20`; 
    }
    
    function updateProgress() { 
        progressFill.style.width = ((currentIndex+1)/20*100) + '%'; 
    }
    
    // ========== QUIT QUIZ ==========
    window.quitQuiz = function() { 
        if (confirm('Quit quiz? Your progress will be lost.')) { 
            clearInterval(timer); 
            showSection('mainMenu'); 
        } 
    };
    
    // ========== KEYBOARD SHORTCUTS ==========
    document.addEventListener('keydown', function(e) {
        if (!quizPanel.classList.contains('hidden')) {
            const key = e.key;
            
            if (key >= '1' && key <= '4' && userAnswers[currentIndex] === null) {
                e.preventDefault();
                const idx = parseInt(key) - 1;
                const optionDivs = document.querySelectorAll('.option');
                if (optionDivs[idx]) {
                    userSelections[currentIndex] = idx;
                    optionDivs.forEach(opt => opt.classList.remove('selected'));
                    optionDivs[idx].classList.add('selected');
                }
            }
            
            if (key === 'Enter' && userAnswers[currentIndex] === null && userSelections[currentIndex] !== null) {
                e.preventDefault();
                submitAnswer();
            }
            
            if ((key === ' ' || key === 'Space') && userAnswers[currentIndex] !== null) {
                e.preventDefault();
                nextQuestion();
            }
        }
    });
    
    showSection('mainMenu');
})();
</script>
</body>

</html>
